{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <div class="row">
            <h5 for="Produto" class="col-md-2">Produto</h5>
            <input value="{{produto.Produto}}" name="Produto" disabled>
        </div>
        <div class="row">
            <div class="col-md-2">
                <input type="checkbox" {% if produto.destaque %}checked{% endif %} disabled>
                <label for="destaque">Destaque</label>
            </div>
            <div class="col-md-2">
                <input type="checkbox" {% if produto.promocao %}checked{% endif %} disabled>
                <label for="promocao">Promoção</label>
            </div>
        </div>
        <div class="row">
            <label for="msgPromocao" class="col-md-2">Msg Promoção</label>
            <input value="{{produto.msgPromocao}}" name="msgPromocao" disabled>
        </div>
        <div class="row">
            <label class="col-md-2">Categoria</label>
            <input value="{{produto.categoria.Categoria}}" disabled>
        </div>
        <div class="row">
            <label class="col-md-2">Fabricante</label>
            <input value="{{produto.fabricante.Fabricante}}" disabled>
        </div>
        <div class="row">
            <a href="{% url 'produto' %}" class="btn bg-secondary col-md-2 mt-3">
                <i class="fa fa-rotate-left"></i> Retornar
            </a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
